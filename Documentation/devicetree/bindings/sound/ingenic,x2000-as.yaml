%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/ingenic,x2000-as.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic X2000 Audio System v2

maintainers:
  - Datel OS <datel-os@users.noreply.github.com>

properties:
  compatible:
    const: ingenic,x2000-as

  reg:
    items:
      - description: AS DMA registers
      - description: AS FIFO registers
      - description: AS format converter registers
      - description: AS DSP/DBUS routing registers
      - description: BAIC0 registers

  reg-names:
    items:
      - const: dma
      - const: fifo
      - const: fmtcov
      - const: dsp
      - const: baic

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Audio system AHB2 bus clock
      - description: BAIC0 clock gate
      - description: I2S TX clock

  clock-names:
    items:
      - const: audio
      - const: baic0
      - const: i2s_tx

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - "#sound-dai-cells"

additionalProperties: false
